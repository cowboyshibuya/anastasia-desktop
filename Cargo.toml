[package]
name = "anastasia-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native desktop client for the Anastasia agent engine"

[dependencies]
anastasia-harness-api = { git = "https://github.com/cowboyshibuya/anastasia-engine", rev = "18113fab802ec55619e8d75423026d771755625a" }
anastasia-transport = { git = "https://github.com/cowboyshibuya/anastasia-engine", rev = "18113fab802ec55619e8d75423026d771755625a" }
anyhow = "1"
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = ["test-support"] }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = ["font-kit", "wayland", "x11"] }
rust-i18n = "4"
serde_json = "1"
smol = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
unicode-segmentation = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
